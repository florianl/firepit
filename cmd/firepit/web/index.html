<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>firepit - OTel Profile Visualizer</title>
    <script>window.__BASE_PATH__ = 'FIREPIT_BASE_PATH';</script>
    <script src="d3.v7.min.js"></script>
    <script src="d3-flamegraph.umd.min.js"></script>
    <link rel="stylesheet" href="d3-flamegraph.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="header">
        <h1>🔥 firepit</h1>
        <div class="header-controls">
            <div class="header-controls-left">
                <button class="pause-btn" id="pause-btn">Pause</button>
                <div class="view-mode-filter">
                    <label for="view-select">View:</label>
                    <select id="view-select">
                        <option value="flamegraph">Flame Graph</option>
                        <option value="sandwich">Sandwich</option>
                        <option value="heatmap">Flamescope</option>
                    </select>
                </div>
                <div class="view-mode-filter" id="sort-mode-filter">
                    <label for="sort-select">Sort:</label>
                    <select id="sort-select">
                        <option value="time-ordered">Time Ordered</option>
                        <option value="left-heavy">Left Heavy</option>
                    </select>
                </div>
                <div class="resource-filter">
                    <label for="resource-key-select">Filter:</label>
                    <div id="resource-filter-chips" class="vframe-chips"></div>
                    <select id="resource-key-select">
                        <option value="">+ attribute</option>
                    </select>
                    <select id="resource-value-select" disabled>
                        <option value="">(select attribute)</option>
                    </select>
                </div>
            </div>
            <div class="header-info header-controls-right">
                <span>Profiles: <span id="profile-count">-</span></span>
                <span>Last updated: <span id="last-update">never</span></span>
                <span>Time range: <span id="time-range">-</span></span>
            </div>
        </div>
        <div class="view-mode-filter vframe-row" id="vframe-filter">
            <label for="vframe-add-select">Virtual frames:</label>
            <div id="vframe-chips" class="vframe-chips"></div>
            <select id="vframe-add-select">
                <option value="">+ add</option>
            </select>
        </div>
    </div>

    <div id="tab-strip" class="tab-strip" style="display:none"></div>
    <div id="filter-container" class="filter-container">
        <div class="filter-input-group">
            <div class="filter-input-wrapper">
                <label for="frame-filter">Filter frames:</label>
                <input type="text" id="frame-filter" placeholder="Enter text to highlight matching frames...">
            </div>
            <button class="export-btn" id="export-btn">Export as JSON</button>
        </div>
    </div>
    <div id="charts"></div>
    <div id="tooltip"></div>

    <script type="module" src="app.js"></script>
</body>
</html>
